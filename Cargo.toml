[package]
name = "kestrel"
version = "0.1.0"
edition = "2024"

[dependencies]
crc32fast = "1.5.2"
fastembed = { version = "7.1.1", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }

[dev-dependencies]
tempfile = "3.27.0"
libc = "0.2.190"
serde_json = "1.0.152"
